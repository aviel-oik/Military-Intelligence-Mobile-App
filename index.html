<!DOCTYPE html>

<head>

<body>

    <section class="all-page">

        </section>

        <section class="body-center">
                <div class='radar'>
                <div class='sweep'></div>
                </div>

                <section class="info">
                    <h2>24</h2><p>active signals</p>

        </section>

        <section class="button-left">

        </section>
        <section class="button-center">
                <svg style="display: inline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-code-icon lucide-code"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>        
                <p style="display: inline">Decode</p>
        </section>
        <section class="button-right">
                <svg style="display: inline" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send-icon lucide-send"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>

            <p>card-1</p>
        </article>
        <article class="card-2">
            <p>card-2</p>
        </article>
        <article class="card-3">
            <p>card-3</p>
        </article>
        <article class="card-4">

        <section class="red-button">
            <p id="text">THREAT DETECTED</p>
